
name: Pharmacy Management CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Django Tests and Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pharmacy_db
          POSTGRES_USER: pharmacy_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacy_user -d pharmacy_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: pharmacy_db
      DB_USER: pharmacy_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: github-ci-test-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run critical lint checks
        working-directory: backend
        run: ruff check --select E9,F63,F7,F82 .

      - name: Check Django configuration
        working-directory: backend
        run: python manage.py check

      - name: Check database migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run automated tests
        working-directory: backend
        run: python manage.py test

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pharmacy-api:ci .
